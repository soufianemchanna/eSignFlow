spring:
  application:
    name: document-service
  config:
    import: optional:file:services/document-service/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/document_db
    username: document_svc
    password: document_svc
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
server:
  port: 8081
esignflow:
  jwt:
    secret: ${JWT_SECRET:secret}
    expiration: 3600000
  documents:
    max-file-size-bytes: 10485760
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:esignflow-documents}