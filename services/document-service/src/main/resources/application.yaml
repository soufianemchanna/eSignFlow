spring:
  application:
    name: document-service
  config:
    import: optional:file:services/document-service/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/document_db
    username: document_svc
    password: document_svc
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

server:
  port: 8081
esignflow:
  jwt:
    secret: ${JWT_SECRET:secret}
    expiration: 3600000
  documents:
    max-file-size-bytes: 10485760
  kafka:
    topics:
      document-events: document.events
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:esignflow-documents}
  bucket-init:
    enabled: ${MINIO_BUCKET_INIT_ENABLED:true}