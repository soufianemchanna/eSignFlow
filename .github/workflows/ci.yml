name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build document-service
        working-directory: services/document-service
        run: ./mvnw -B verify

      - name: Build signature-service
        working-directory: services/signature-service
        run: ./mvnw -B verify

      - name: Build notification-service
        working-directory: services/notification-service
        run: ./mvnw -B verify
