version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: esignflow-postgres
    environment:
      POSTGRES_USER: esignflow
      POSTGRES_PASSWORD: esignflow
      POSTGRES_DB: esignflow
    ports:
      - "54332:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: esignflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_LISTENERS: PLAINTEXT://:9092, CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: esignflow-cluster-1
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: signflow-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  minio:
    image: minio/minio:latest
    container_name: esignflow-minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: esignflow
      MINIO_ROOT_PASSWORD: esignflow123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: esignflow-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"


volumes:
  pgdata:
  miniodata: